[package]
name = "guardwsl"
version = "0.2.0" # x-release-please-version
edition = "2024"
rust-version = "1.100.0"
description = "Host-aware disk pressure protection for WSL2"
license = "Apache-2.0 OR MIT"
repository = "https://github.com/emersonbusson/guardwsl"
readme = "README.md"
keywords = ["wsl", "wsl2", "disk-space", "cleanup"]
categories = ["command-line-utilities", "development-tools", "filesystem"]
publish = false

[[bin]]
name = "guard"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4.5", features = ["derive"] }
jiff = { version = "1", default-features = false, features = ["std", "serde"] }
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1.1"
walkdir = "2"

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
